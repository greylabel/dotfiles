---
name: shfmt

"on":
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Same version as Neovim's format-on-save (Mason)
      SHFMT_VERSION: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install shfmt
        run: |
          curl -fsSL -o shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  shfmt" | sha256sum -c -
          chmod +x shfmt
      - name: Check formatting
        # Indentation comes from .editorconfig (2 spaces)
        run: ./shfmt --diff bootstrap.sh .bash_prompt .exports .aliases .functions .bash_profile .bashrc
