# ~/.config/tmux/tmux.conf
#
# Shared with herdr: prefix C-a; prefix+h/j/k/l focus panes;
# prefix+H/J/K/L resize; prefix+| and prefix+- split; prefix+c new window.
# Ctrl+h/j/k/l is left for Neovim splits.

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Vim-like key handling in tmux modes
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Terminal + colors (Ghostty sets TERM=xterm-ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Neovim: no Esc delay; focus events let it reload files changed by agents
set -sg escape-time 10
set -g focus-events on

# General
set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane navigation (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes and new windows in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Clear the pane and its scrollback (herdr: prefix+ctrl+l)
bind C-l send-keys C-l \; clear-history

# Status bar
set-option -g status-position top

# Colors: Tokyo Night Storm / Day, switching with the terminal's light/dark
# mode. Needs tmux 3.6+ (theme colour slots); older tmux keeps its default
# colors.
if-shell "tmux show -g dark-theme-black > /dev/null 2>&1" \
	"source-file ~/.config/tmux/theme.conf"

# TPM (install: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'
if-shell "test -d ~/.config/tmux/plugins/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
