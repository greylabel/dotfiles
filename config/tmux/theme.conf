# Sourced by tmux.conf on tmux 3.6+, which has light/dark theme colour slots.

# Colors: Tokyo Night Storm (dark) / Day (light). tmux picks the set that
# matches the terminal's reported background and switches with macOS.
# Slot names are tmux's; the comment gives the role each one plays here.
set -g dark-theme-black "#1f2335"       # bar background
set -g dark-theme-white "#a9b1d6"       # bar text
set -g dark-theme-dark-grey "#565f89"   # muted text
set -g dark-theme-light-grey "#3b4261"  # pane border
set -g dark-theme-blue "#7aa2f7"        # accent
set -g dark-theme-magenta "#bb9af7"     # current window
set -g dark-theme-cyan "#292e42"        # message background
set -g dark-theme-green "#2e3c64"       # selection
set -g dark-theme-yellow "#e0af68"
set -g dark-theme-red "#f7768e"
set -g light-theme-black "#d0d5e3"
set -g light-theme-white "#6172b0"
set -g light-theme-dark-grey "#848cb5"
set -g light-theme-light-grey "#a8aecb"
set -g light-theme-blue "#2e7de9"
set -g light-theme-magenta "#9854f1"
set -g light-theme-cyan "#c4c8da"
set -g light-theme-green "#b7c1e3"
set -g light-theme-yellow "#8c6c3e"
set -g light-theme-red "#f52a65"

# Status bar
set -g status-style "bg=themeblack,fg=themewhite"
set -g status-left "#[fg=themeblack,bg=themeblue,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=themedarkgrey]%Y-%m-%d %H:%M #[fg=themewhite]| #h "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=themeblack,bg=thememagenta,bold] #I:#W "
set -g message-style "bg=themecyan,fg=themeblue"
setw -g mode-style "bg=themegreen"

# Pane borders
set -g pane-border-style "fg=themelightgrey"
set -g pane-active-border-style "fg=themeblue"
