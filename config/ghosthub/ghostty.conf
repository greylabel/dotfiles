# https://ghosthub.ai/docs/terminal-configuration/

# Ghosthub embeds libghostty but doesn't read Ghostty's config, so this file
# includes it: theme, font, scrollback and Option key come from there.
# Ghosthub appends any of the keys below that are missing (into this repo,
# through the link), so they're set here. The included file is read last and
# wins where both set a key.
term = xterm-256color
shell-integration = detect
macos-option-as-alt = left
# Ghosthub's default is 3, which shifts the theme's colors; 1 is Ghostty's
minimum-contrast = 1
scrollback-limit = 100000000

config-file = ~/.config/ghostty/config.ghostty

# >>> Ghosthub managed terminal settings >>>
term = xterm-256color
cursor-style = block
mouse-hide-while-typing = true
copy-on-select = clipboard
shell-integration = detect
shell-integration-features = no-cursor
# <<< Ghosthub managed terminal settings <<<
